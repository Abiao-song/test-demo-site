<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI提示词生成器</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
        body{background:#111827;color:#f3f4f6;padding:32px 20px}
        .container{max-width:720px;margin:0 auto}
        .card{background:#1f2937;padding:32px;border-radius:16px;border:1px solid #374151}
        h1{margin-bottom:28px;font-size:22px;text-align:center}
        .field{margin-bottom:22px}
        label{display:block;margin-bottom:10px;color:#d1d5db}
        .field-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
        .field-head label{margin-bottom:0}
        .template-hint{font-size:12px;color:#9ca3af;line-height:1.4}
        select,textarea{
            width:100%;
            padding:12px 14px;
            border-radius:8px;
            border:1px solid #374151;
            background:#111827;
            color:#f3f4f6;
            font-size:16px;
            outline:none;
        }
        textarea{min-height:120px;resize:vertical}
        .btn-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 24px}
        button{
            padding:12px 20px;
            border:none;
            border-radius:8px;
            color:#fff;
            font-size:16px;
            cursor:pointer;
        }
        #submitBtn{background:#2563eb}
        #submitBtn:hover{background:#1d4ed8}
        #clearBtn{background:#4b5563}
        #clearBtn:hover{background:#6b7280}
        #copyBtn{background:#059669}
        #copyBtn:hover{background:#047857}
        button:disabled{background:#475569;cursor:not-allowed}
        .result-wrap{position:relative}
        .result-box{
            background:rgba(255,255,255,0.08);
            border-radius:12px;
            padding:20px;
            min-height:140px;
            white-space:pre-wrap;
            line-height:1.6;
            color:#e5e7eb;
        }
        .copy-toast{
            position:absolute;
            left:50%;
            bottom:18px;
            transform:translateX(-50%);
            padding:8px 16px;
            border-radius:999px;
            background:#064e3b;
            color:#d1fae5;
            font-size:14px;
            opacity:0;
            pointer-events:none;
            transition:opacity .2s ease;
        }
        .copy-toast.show{opacity:1}
        .char-count{margin-top:10px;font-size:13px;color:#9ca3af}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>AI提示词生成器</h1>
            <div class="field">
                <div class="field-head">
                    <label for="templateSelect">选择生成模板：</label>
                    <span id="templateHint" class="template-hint">生成标题+五点描述</span>
                </div>
                <select id="templateSelect">
                    <option value="amazon">亚马逊Listing标题+五点</option>
                    <option value="xiaohongshu">小红书种草文案</option>
                    <option value="mainImage">产品主图AI绘图提示词</option>
                    <option value="title">电商产品标题</option>
                </select>
            </div>
            <div class="field">
                <label for="userInput">你想要做什么？简单描述需求：</label>
                <textarea id="userInput" placeholder="例如：帮我写一个适合短视频带货的文案，产品是蓝牙耳机"></textarea>
            </div>
            <div class="btn-row">
                <button id="submitBtn" type="button">生成专业提示词</button>
                <button id="clearBtn" type="button">清空</button>
                <button id="copyBtn" type="button" style="display:none;">一键复制结果</button>
            </div>
            <div class="result-wrap" id="resultWrap">
                <div class="result-box" id="result">生成结果会展示在这里...</div>
                <div id="copyToast" class="copy-toast">已复制</div>
            </div>
            <div id="charCount" class="char-count">输出字数：0</div>
        </div>
    </div>
    <script>
        const submitBtn = document.getElementById('submitBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const userInput = document.getElementById('userInput');
        const result = document.getElementById('result');
        const templateSelect = document.getElementById('templateSelect');
        const copyToast = document.getElementById('copyToast');
        const templateHint = document.getElementById('templateHint');
        const resultWrap = document.getElementById('resultWrap');
        const charCount = document.getElementById('charCount');
        let lastResultText = "";
        let toastTimer = null;
        const RESULT_PLACEHOLDER = "生成结果会展示在这里...";

        const templates = {
            amazon: {
                hint: "生成标题+五点描述",
                sample: "降噪蓝牙耳机，续航30小时，适合通勤和办公",
                system: "你是提示词专家。根据用户需求，生成亚马逊Listing标题+五条Bullet Points的专业、详细、高质量AI提示词。直接输出提示词，不要多余解释。"
            },
            xiaohongshu: {
                hint: "种草文案",
                sample: "夏日防晒霜，清爽不油腻，学生党平价",
                system: "你是提示词专家。根据用户需求，生成小红书种草文案的专业、详细、高质量AI提示词（含标题、正文、话题标签）。直接输出提示词，不要多余解释。"
            },
            mainImage: {
                hint: "AI绘图提示词",
                sample: "白色无线耳机，金属质感，深色渐变背景",
                system: "你是提示词专家。根据用户需求，生成产品主图AI绘图提示词，需包含主体、材质、光影、构图、背景和画质关键词。直接输出提示词，不要多余解释。"
            },
            title: {
                hint: "商品短标题",
                sample: "真空保温杯，316不锈钢，500ml，送礼",
                system: "你是提示词专家。根据用户需求，生成多条电商产品标题的专业、详细、高质量AI提示词。直接输出提示词，不要多余解释。"
            }
        };

        function updateCharCount() {
            charCount.textContent = "输出字数：" + (lastResultText ? lastResultText.length : 0);
        }

        function applyTemplate() {
            const tpl = templates[templateSelect.value] || templates.amazon;
            templateHint.textContent = tpl.hint;
            userInput.value = tpl.sample;
        }

        function showCopyToast() {
            copyToast.classList.add("show");
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => copyToast.classList.remove("show"), 1600);
        }

        applyTemplate();
        templateSelect.onchange = applyTemplate;

        clearBtn.onclick = () => {
            userInput.value = "";
            lastResultText = "";
            result.innerText = RESULT_PLACEHOLDER;
            copyBtn.style.display = "none";
            copyToast.classList.remove("show");
            updateCharCount();
        };

        submitBtn.onclick = async () => {
            const content = userInput.value.trim();
            if(!content){
                result.innerText = "请输入你的需求！";
                lastResultText = "";
                copyBtn.style.display = "none";
                updateCharCount();
                return;
            }
            submitBtn.disabled = true;
            result.innerText = "正在生成，请稍候…";
            lastResultText = "";
            copyBtn.style.display = "none";
            updateCharCount();
            const tpl = templates[templateSelect.value] || templates.amazon;
            try{
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: [
                            {role:"system", content: tpl.system},
                            {role:"user", content: content}
                        ]
                    })
                });
                const json = await res.json();
                if(json.error){
                    result.innerText = "出错：" + json.error;
                    lastResultText = "";
                    copyBtn.style.display = "none";
                }else{
                    lastResultText = json.choices[0].message.content;
                    result.innerText = lastResultText;
                    copyBtn.style.display = "inline-block";
                }
            }catch(err){
                result.innerText = "请求异常：" + err.message;
                lastResultText = "";
                copyBtn.style.display = "none";
            }
            updateCharCount();
            resultWrap.scrollIntoView({ behavior: "smooth", block: "start" });
            submitBtn.disabled = false;
        }

        copyBtn.onclick = async () => {
            if(!lastResultText) return;
            try{
                await navigator.clipboard.writeText(lastResultText);
                showCopyToast();
            }catch(e){
                const temp = document.createElement("textarea");
                temp.value = lastResultText;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                document.body.removeChild(temp);
                showCopyToast();
            }
        }
    </script>
</body>
</html>
