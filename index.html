<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI提示词生成器</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
        body{background:#111827;color:#f3f4f6;padding:24px}
        .container{max-width:720px;margin:0 auto}
        .card{background:#1f2937;padding:24px;border-radius:16px}
        h1{margin-bottom:16px;font-size:22px;text-align:center}
        label{display:block;margin-bottom:8px}
        select{
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #374151;
            background:#111827;
            color:#f3f4f6;
            font-size:16px;
            margin-bottom:16px;
            outline:none;
        }
        textarea{width:100%;padding:12px;border-radius:8px;border:none;font-size:16px;min-height:100px}
        button{margin-top:12px;padding:12px 20px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}
        button:disabled{background:#475569;cursor:not-allowed}
        .result-box{margin-top:12px;background:rgba(255,255,255,0.08);border-radius:12px;padding:18px;min-height:120px;white-space:pre-wrap;}
        .copy-btn{background:#10b981;margin-left:10px;}
        .btn-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>AI提示词生成器</h1>
            <label for="templateSelect">选择生成模板：</label>
            <select id="templateSelect">
                <option value="amazon">亚马逊Listing标题+五点</option>
                <option value="xiaohongshu">小红书种草文案</option>
                <option value="mainImage">产品主图AI绘图提示词</option>
                <option value="title">电商产品标题</option>
            </select>
            <label for="userInput">你想要做什么？简单描述需求：</label>
            <textarea id="userInput" placeholder="例如：帮我写一个适合短视频带货的文案，产品是蓝牙耳机"></textarea>
            <div class="btn-row">
                <button id="submitBtn">生成专业提示词</button>
                <button id="copyBtn" class="copy-btn" style="display:none;">一键复制结果</button>
            </div>
            <div class="result-box" id="result">生成结果会展示在这里...</div>
        </div>
    </div>
    <script>
        const submitBtn = document.getElementById('submitBtn');
        const copyBtn = document.getElementById('copyBtn');
        const userInput = document.getElementById('userInput');
        const result = document.getElementById('result');
        const templateSelect = document.getElementById('templateSelect');
        let lastResultText = "";

        const templates = {
            amazon: {
                placeholder: "例如：降噪蓝牙耳机，续航30小时，适合通勤和办公",
                system: "你是提示词专家。根据用户需求，生成亚马逊Listing标题+五条Bullet Points的专业、详细、高质量AI提示词。直接输出提示词，不要多余解释。"
            },
            xiaohongshu: {
                placeholder: "例如：夏日防晒霜，清爽不油腻，学生党平价",
                system: "你是提示词专家。根据用户需求，生成小红书种草文案的专业、详细、高质量AI提示词（含标题、正文、话题标签）。直接输出提示词，不要多余解释。"
            },
            mainImage: {
                placeholder: "例如：白色无线耳机，金属质感，深色渐变背景",
                system: "你是提示词专家。根据用户需求，生成产品主图AI绘图提示词，需包含主体、材质、光影、构图、背景和画质关键词。直接输出提示词，不要多余解释。"
            },
            title: {
                placeholder: "例如：真空保温杯，316不锈钢，500ml，送礼",
                system: "你是提示词专家。根据用户需求，生成多条电商产品标题的专业、详细、高质量AI提示词。直接输出提示词，不要多余解释。"
            }
        };

        function applyTemplatePlaceholder() {
            const tpl = templates[templateSelect.value] || templates.amazon;
            userInput.placeholder = tpl.placeholder;
        }

        applyTemplatePlaceholder();
        templateSelect.onchange = applyTemplatePlaceholder;

        submitBtn.onclick = async () => {
            const content = userInput.value.trim();
            if(!content){
                result.innerText = "请输入你的需求！";
                copyBtn.style.display = "none";
                return;
            }
            submitBtn.disabled = true;
            result.innerText = "正在生成...";
            copyBtn.style.display = "none";
            const tpl = templates[templateSelect.value] || templates.amazon;
            try{
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: [
                            {role:"system", content: tpl.system},
                            {role:"user", content: content}
                        ]
                    })
                });
                const json = await res.json();
                if(json.error){
                    result.innerText = "出错：" + json.error;
                    copyBtn.style.display = "none";
                }else{
                    lastResultText = json.choices[0].message.content;
                    result.innerText = lastResultText;
                    copyBtn.style.display = "inline-block";
                }
            }catch(err){
                result.innerText = "请求异常：" + err.message;
                copyBtn.style.display = "none";
            }
            submitBtn.disabled = false;
        }

        copyBtn.onclick = async () => {
            try{
                await navigator.clipboard.writeText(lastResultText);
                copyBtn.innerText = "✅ 已复制";
                setTimeout(()=> copyBtn.innerText = "一键复制结果",1500)
            }catch(e){
                copyBtn.innerText = "复制失败";
                setTimeout(()=> copyBtn.innerText = "一键复制结果",1500)
            }
        }
    </script>
</body>
</html>
