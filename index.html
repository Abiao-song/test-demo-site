<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI提示词生成工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,#1e40af,#7c3aed);
            padding:30px 16px;
        }
        .container {
            max-width:700px;
            margin:0 auto;
        }
        .card {
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(14px);
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.2);
            padding:32px;
            color:#fff;
        }
        h1 {
            text-align:center;
            margin-bottom:24px;
            font-size:28px;
        }
        label {
            display:block;
            margin:16px 0 8px;
            font-weight:500;
        }
        textarea {
            width:100%;
            min-height:100px;
            padding:14px;
            border-radius:12px;
            border:none;
            outline:none;
            font-size:15px;
            resize:vertical;
        }
        button {
            width:100%;
            margin-top:20px;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#ffffff;
            color:#1e40af;
            font-weight:bold;
            font-size:16px;
            cursor:pointer;
        }
        button:disabled {
            opacity:0.6;
            cursor:not-allowed;
        }
        .result-box {
            margin-top:24px;
            background:rgba(0,0,0,0.25);
            border-radius:12px;
            padding:18px;
            min-height:120px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>AI 提示词生成器</h1>
            <label>你想要做什么？简单描述需求：</label>
            <textarea id="userInput" placeholder="例如：帮我写一个适合短视频带货的文案，产品是蓝牙耳机"></textarea>
            <button id="submitBtn">生成专业提示词</button>
            <div class="result-box" id="result">生成结果会展示在这里...</div>
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const userInput = document.getElementById('userInput');
        const result = document.getElementById('result');

        submitBtn.onclick = async () => {
            const content = userInput.value.trim();
            if(!content) {
                result.innerText = "请输入你的需求！";
                return;
            }
            submitBtn.disabled = true;
            result.innerText = "正在生成...";
            try{
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ userPrompt: content })
                })
                const data = await res.json();
                if(data.success){
                    result.innerText = data.content;
                }else{
                    result.innerText = "出错："+data.msg;
                }
            }catch(err){
                result.innerText = "网络/跨域错误："+err.message;
            }
            submitBtn.disabled = false;
        }
    </script>
</body>
</html>
