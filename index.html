<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI提示词生成工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,#1e40af,#7c3aed);
            padding:30px 16px;
        }
        .container {
            max-width:700px;
            margin:0 auto;
        }
        .card {
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(14px);
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.2);
            padding:32px;
            color:#fff;
        }
        h1 {
            text-align:center;
            margin-bottom:24px;
            font-size:28px;
        }
        label {
            display:block;
            margin-bottom:8px;
            font-size:16px;
        }
        textarea {
            width:100%;
            padding:14px;
            border-radius:12px;
            border:none;
            font-size:16px;
            min-height:120px;
            margin-bottom:20px;
        }
        button {
            width:100%;
            padding:14px;
            border-radius:12px;
            border:none;
            font-size:17px;
            color:#1e40af;
            font-weight:bold;
            cursor:pointer;
        }
        #result {
            margin-top:20px;
            min-height:80px;
            padding:16px;
            background:rgba(0,0,0,0.2);
            border-radius:12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>AI 提示词生成器</h1>
            <label>你想要做什么？简单描述需求：</label>
            <textarea id="inputBox" placeholder="例如：亚马逊标题"></textarea>
            <button id="submitBtn">生成专业提示词</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const inputBox = document.getElementById('inputBox');
        const submitBtn = document.getElementById('submitBtn');
        const resultDom = document.getElementById('result');

        submitBtn.onclick = async function(){
            const userPrompt = inputBox.value.trim();
            if(!userPrompt){
                resultDom.innerText = "请输入需求";
                return;
            }
            resultDom.innerText = "正在请求...";
            try {
                // ✅ 重点：接口地址 /api/chat 和你的文件名 chat.js 对应！
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ userPrompt })
                });
                const json = await res.json();
                if(json.error){
                    resultDom.innerText = "出错：" + json.error;
                }else{
                    resultDom.innerText = json.result;
                }
            } catch (e) {
                resultDom.innerText = "网络异常：" + String(e);
            }
        }
    </script>
</body>
</html>
